<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GYM | Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="register-body">

    <main class="register-page">

        <section class="register-container">

            <!-- Brand -->
            <div class="register-brand">
                <div class="register-logo">G</div>

                <div>
                    <h1>GYM</h1>
                    <p>Workout Tracker</p>
                </div>
            </div>


            <!-- Header -->
            <div class="register-header">

                <p class="register-label">
                    GET STARTED
                </p>

                <h2>
                    Create your account
                </h2>

                <p class="register-subtitle">
                    Start tracking your workouts and building
                    your fitness journey.
                </p>

            </div>


            <!-- Registration Form -->
            <form id="registerForm" class="register-form">

                <!-- Full Name -->
                <div class="register-form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Username -->
                <div class="register-form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Email -->
                <div class="register-form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="register-form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="register-form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- Message -->
                <p
                    id="registerMessage"
                    class="register-message"
                    aria-live="polite"
                ></p>


                <!-- Sign Up -->
                <button
                    type="submit"
                    id="registerButton"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->
            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Login
                </a>

            </div>


            <!-- Footer -->
            <div class="register-footer">

                <span>GYM TRACKER</span>

                <span>•</span>

                <span>Track. Train. Progress.</span>

            </div>

        </section>

    </main>


    <script src="js/auth.js"></script>

</body>
</html>
