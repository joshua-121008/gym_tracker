<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gym | Log Workout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="workout-body">

<header class="navbar">

    <div class="logo">
        <a href="dashboard.html">GYM</a>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="plans.html">Workout Plans</a>
        <a href="program.html">Programs</a>
        <a href="workout.html" class="active">Log Workout</a>
        <a href="history.html">History</a>
        <a href="progress.html">Progress</a>
        <a href="profile.html">Profile</a>

        <button id="logoutButton" class="logout-btn">
            Logout
        </button>
    </nav>

</header>


<main class="workout-page">

    <section class="workout-header">

        <p class="workout-label">TRAINING</p>

        <h1>Log Workout</h1>

        <p>
            Record your training and track your progress.
        </p>

    </section>


    <form id="workoutForm">

        <!-- WORKOUT DETAILS -->

        <section class="workout-section">

            <div class="section-title">
                <h2>Workout Details</h2>
            </div>

            <div class="workout-details-grid">

                <div class="form-group">
                    <label for="workoutName">
                        Workout Name
                    </label>

                    <input
                        type="text"
                        id="workoutName"
                        placeholder="Example: Chest & Triceps"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="workoutDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="workoutDate"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="workoutPlan">
                        Workout Plan
                    </label>

                    <select id="workoutPlan">

                        <option value="">
                            Select a workout plan
                        </option>

                    </select>
                </div>

            </div>


            <div class="form-group workout-notes">

                <label for="workoutNotes">
                    Notes
                </label>

                <textarea
                    id="workoutNotes"
                    rows="3"
                    placeholder="Optional notes..."
                ></textarea>

            </div>

        </section>


        <!-- EXERCISES -->

        <section class="workout-section">

            <div class="section-heading-row">

                <div>
                    <p class="workout-label">EXERCISES</p>

                    <h2>Your Exercises</h2>
                </div>

                <button
                    type="button"
                    id="addExerciseButton"
                    class="secondary-btn"
                >
                    + Add Exercise
                </button>

            </div>


            <div id="exerciseList"></div>

        </section>


        <!-- SUMMARY -->

        <section class="workout-summary">

            <div class="summary-item">

                <span>Exercises</span>

                <strong id="workoutTotalExercises">
                    0
                </strong>

            </div>


            <div class="summary-item">

                <span>Sets</span>

                <strong id="workoutTotalSets">
                    0
                </strong>

            </div>


            <div class="summary-item">

                <span>Reps</span>

                <strong id="workoutTotalReps">
                    0
                </strong>

            </div>


            <div class="summary-item">

                <span>Total Volume</span>

                <strong id="workoutTotalVolume">
                    0.0 kg
                </strong>

            </div>

        </section>


        <!-- MESSAGE -->

        <p
            id="workoutMessage"
            class="form-message"
        ></p>


        <!-- ACTIONS -->

        <div class="workout-actions">

            <a
                href="dashboard.html"
                class="cancel-btn"
            >
                Cancel
            </a>

            <button
                type="submit"
                id="saveWorkoutButton"
                class="save-workout-btn"
            >
                Save Workout
            </button>

        </div>

    </form>

</main>


<footer>

    <p>
        &copy; 2026 GYM. All rights reserved.
    </p>

</footer>


<script src="js/workout.js"></script>

</body>
</html>
